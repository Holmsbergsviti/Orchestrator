<!DOCTYPE html>
<!--
  FILE PURPOSE (in plain terms): The operator console's single web page. It loads the
  fleet + program list from the local server, lets you rename machines and tick which
  machines run which program (a grid of checkboxes), and saves your changes back to
  GitHub. All CSS/JS is inline so it needs nothing from the internet.

  The look is a green-on-black terminal with a faint rain of 0s and 1s behind the page.
  That rain is pure decoration: a fixed canvas that never takes clicks, runs at a low
  frame rate, pauses while the tab is hidden, and stays still for anyone whose system asks
  for reduced motion.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchestrator Console</title>
  <style>
    /* "Terminal" theme: green phosphor on black, monospace everywhere, with a faint rain of
       0s and 1s behind the page (the #rain canvas, drawn by the script at the bottom). Every
       colour comes from these variables, so the whole look can be retuned in one place. */
    :root {
      --bg: #020803; --card: rgba(3, 18, 8, .86); --ink: #b8ffcc; --muted: #4f9e66;
      --line: #0f3d1f; --accent: #00ff66; --ok: #00ff66; --off: #2f5c3d;
      --err: #ff3b5c; --okbg: rgba(0, 255, 102, .08); --errbg: rgba(255, 59, 92, .1);
      --warn: #e6ff4d; --glow: 0 0 6px rgba(0, 255, 102, .55);
      --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.55 var(--mono); background: var(--bg); color: var(--ink);
           accent-color: var(--accent); min-height: 100vh; }
    /* The 0/1 rain sits behind everything and never takes a click. */
    #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: .32; }
    /* CRT scanlines over the whole page — subtle enough not to cost readability. */
    body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 10;
                  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px); }
    ::selection { background: var(--accent); color: #000; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
             padding: 12px 20px; background: rgba(1, 10, 4, .92); border-bottom: 1px solid var(--line);
             box-shadow: 0 1px 18px rgba(0, 255, 102, .08); backdrop-filter: blur(3px); }
    header h1 { font-size: 15px; margin: 0; color: var(--accent); text-shadow: var(--glow); letter-spacing: .08em; text-transform: uppercase; }
    header h1::before { content: '> '; color: var(--muted); }
    header h1::after { content: '_'; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    header .repo { color: var(--muted); font-size: 12px; }
    header .repo::before { content: '[repo] '; }
    header .spacer { flex: 1; }
    button { font: inherit; border: 1px solid var(--line); background: rgba(0, 0, 0, .55); color: var(--ink);
             padding: 6px 13px; border-radius: 3px; cursor: pointer; transition: border-color .12s, box-shadow .12s, color .12s; }
    button:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
    button:focus-visible, .fld:focus-visible, .search:focus-visible, input.label:focus-visible, summary:focus-visible {
      outline: 1px solid var(--accent); outline-offset: 1px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #001a09; font-weight: 700; }
    button.primary:hover { color: #001a09; box-shadow: 0 0 14px rgba(0, 255, 102, .7); }
    button.danger { color: var(--err); border-color: rgba(255, 59, 92, .45); }
    button.danger:hover { background: var(--errbg); border-color: var(--err); color: var(--err); box-shadow: 0 0 8px rgba(255, 59, 92, .5); }
    button.primary:disabled { opacity: .35; cursor: default; box-shadow: none; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px;
            padding: 16px 18px; margin-bottom: 20px; box-shadow: inset 0 0 24px rgba(0, 255, 102, .035); }
    .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; text-shadow: var(--glow); }
    .card h2::before { content: '// '; color: var(--muted); text-shadow: none; }
    .muted { color: var(--muted); }
    .warn { background: rgba(230, 255, 77, .06); border: 1px solid rgba(230, 255, 77, .35); color: var(--warn);
            padding: 8px 12px; border-radius: 3px; margin-bottom: 10px; font-size: 12px; }
    .warn::before { content: '[!] '; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:hover td { background: rgba(0, 255, 102, .045); }
    th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2.4s ease-in-out infinite; }
    .dot.off { background: var(--off); }
    @keyframes pulse { 50% { box-shadow: 0 0 2px var(--ok); } }
    .pill { font-size: 11px; padding: 0 7px; border-radius: 2px; border: 1px solid var(--line); }
    .pill.ok { background: var(--okbg); color: var(--ok); border-color: rgba(0, 255, 102, .4); }
    .pill.bad { background: var(--errbg); color: var(--err); border-color: rgba(255, 59, 92, .45); }
    input.label { font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px; width: 160px; background: rgba(0,0,0,.5); color: var(--ink); }
    details.add summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; color: var(--accent);
                          text-transform: uppercase; letter-spacing: .1em; text-shadow: var(--glow); }
    details.add summary::-webkit-details-marker { display: none; }
    details.add summary::before { content: '[+] '; color: var(--accent); }
    details.add[open] summary::before { content: '[-] '; }
    .addgrid { display: grid; grid-template-columns: 130px 1fr; gap: 10px 14px; align-items: center; margin-top: 16px; max-width: 660px; }
    .addgrid > label { color: var(--muted); font-size: 12px; }
    .addgrid > label::after, .cfggrid > label::after { content: ':'; }
    .fld { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; width: 100%; background: rgba(0, 0, 0, .55); color: var(--ink); caret-color: var(--accent); }
    .fld::placeholder, .search::placeholder { color: var(--off); }
    .flags { display: flex; gap: 16px; flex-wrap: wrap; }
    .flags label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; }
    .addgrid .full { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    .seg button { border: none; border-radius: 0; padding: 6px 13px; background: rgba(0, 0, 0, .55); }
    .seg button:hover { box-shadow: none; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.active { background: var(--accent); color: #001a09; font-weight: 700; }
    .search { font: inherit; padding: 6px 11px; border: 1px solid var(--line); border-radius: 3px; min-width: 200px; background: rgba(0, 0, 0, .55); color: var(--ink); caret-color: var(--accent); }
    .titem { border: 1px solid var(--line); border-radius: 3px; margin-bottom: 8px; background: rgba(0, 0, 0, .35); }
    .titem:hover { border-color: rgba(0, 255, 102, .35); }
    .titem > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
    .titem > summary::-webkit-details-marker { display: none; }
    .titem > summary::after { content: '▸'; color: var(--muted); }
    .titem[open] > summary::after { content: '▾'; }
    .tname { font-weight: 700; color: var(--accent); }
    .tid { font-size: 11px; }
    .tsum { font-size: 11px; margin-left: auto; }
    .tbody { padding: 8px 14px 14px; border-top: 1px solid var(--line); }
    .allrow { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; font-size: 12px; }
    .checklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 7px 16px; }
    .checklist label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .cfg { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .cfglabel { font-size: 11px; font-weight: 600; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .cfggrid { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; max-width: 520px; margin-top: 12px; }
    .cfggrid > label { font-size: 12px; }
    .scroll { overflow-x: auto; }
    .matrix th.mcol { text-align: center; white-space: nowrap; }
    .matrix td.cell { text-align: center; }
    .matrix td.prog { white-space: nowrap; }
    .matrix .allbox { text-align: center; }
    a { color: var(--accent); }
    a:hover { text-shadow: var(--glow); }
    code { background: rgba(0, 255, 102, .08); color: var(--accent); padding: 1px 5px; border-radius: 2px; font-size: 12px; }
    /* Agent-build readout in the Machines table (see the renderer in the script). */
    .build-ok { color: var(--ok); } .build-pending { color: var(--warn); }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
             background: #000; color: var(--accent); border: 1px solid var(--accent); box-shadow: var(--glow);
             padding: 9px 16px; border-radius: 3px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast::before { content: '$ '; color: var(--muted); }
    #toast.show { opacity: 1; }
    #toast.err { color: var(--err); border-color: var(--err); box-shadow: 0 0 8px rgba(255, 59, 92, .5); }
    .empty { color: var(--muted); padding: 12px 0; }
    .empty::before { content: '-- '; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #010502; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    /* On a phone the header wraps to several lines, so pinning it would eat the screen. */
    @media (max-width: 700px) { header { position: static; } }
    @media (prefers-reduced-motion: reduce) {
      header h1::after, .dot.on { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <header>
    <h1>Orchestrator Console</h1>
    <span class="repo" id="repo"></span>
    <span class="spacer"></span>
    <button id="reload">Reload</button>
    <button id="save" class="primary" disabled>Save &amp; push</button>
    <form method="post" action="/logout" style="margin:0"><button type="submit" title="Sign out">Sign out</button></form>
  </header>

  <main>
    <div id="warnings"></div>

    <div class="card">
      <h2>Machines <button type="button" id="wakeAll" style="margin-left:10px; font-size:12px; padding:4px 10px">Wake all</button></h2>
      <div class="scroll">
        <table id="machines">
          <thead>
            <tr>
              <th>Status</th><th>Label</th><th>Hostname</th><th>OS</th>
              <th>Agent</th><th>Last seen</th><th>Running</th><th>Last sync</th><th>Power</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="noMachines" hidden>No machines have reported yet.</div>
    </div>

    <div class="card">
      <h2>Targeting</h2>
      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button type="button" data-view="program" class="active">By program</button>
          <button type="button" data-view="machine">By machine</button>
        </div>
        <input class="search" id="search" placeholder="Filter…" />
        <span class="muted" id="tcount"></span>
      </div>
      <div id="tview"></div>
    </div>

    <div class="card">
      <details class="add">
        <summary>Add a program</summary>
        <div class="addgrid">
          <label for="a-name">Name *</label>
          <input class="fld" id="a-name" placeholder="my-app" />

          <label for="a-version">Version</label>
          <input class="fld" id="a-version" value="1.0" />

          <label for="a-type">Type</label>
          <select class="fld" id="a-type">
            <option value="exe">exe</option>
            <option value="batch">batch (.bat)</option>
            <option value="powershell">powershell (.ps1)</option>
            <option value="vbs">vbs</option>
            <option value="python">python (.py)</option>
          </select>

          <label>File source</label>
          <div class="flags">
            <label><input type="radio" name="a-src" value="import" checked /> Import a local file</label>
            <label><input type="radio" name="a-src" value="path" /> Already in the repo</label>
          </div>

          <label for="a-local" id="a-local-label">Local file path</label>
          <input class="fld" id="a-local" placeholder="/Users/you/tools/my-app.exe" />

          <label for="a-repopath" id="a-repopath-label" hidden>Repo path</label>
          <input class="fld" id="a-repopath" placeholder="programs/my-app/v1.0/my-app.exe" hidden />

          <label for="a-filename">File name</label>
          <input class="fld" id="a-filename" placeholder="(defaults to the file's own name)" />

          <label for="a-install">Install path</label>
          <input class="fld" id="a-install" placeholder="C:\Windows\Orch\programs\my-app (default)" />

          <label for="a-args">Arguments</label>
          <input class="fld" id="a-args" placeholder="--silent (optional)" />

          <label for="a-desc">Description</label>
          <input class="fld" id="a-desc" placeholder="(optional)" />

          <label>Options</label>
          <div class="flags">
            <label><input type="checkbox" id="a-startup" /> runAtStartup</label>
            <label><input type="checkbox" id="a-admin" /> runAsAdmin</label>
            <label><input type="checkbox" id="a-once" /> runOnceInstalled</label>
            <label><input type="checkbox" id="a-all" checked /> all machines</label>
          </div>

          <div class="full">
            <button type="button" id="a-submit" class="primary">Add &amp; push</button>
            <span class="muted">Imports the file into the repo, checksums it, commits &amp; pushes.</span>
          </div>
        </div>
      </details>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    let state = null;
    let dirty = false;
    let view = 'program';        // 'program' | 'machine' — persists across reloads
    let filter = '';             // search text
    const expanded = new Set();  // which rows are open (keys: 'p:<id>' / 'm:<id>')

    const $ = (s, r = document) => r.querySelector(s);
    const el = (tag, props = {}, kids = []) => {
      const n = Object.assign(document.createElement(tag), props);
      for (const k of [].concat(kids)) n.append(k);
      return n;
    };

    function markDirty() { dirty = true; $('#save').disabled = false; }

    function toast(msg, isErr = false) {
      const t = $('#toast');
      t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
      setTimeout(() => (t.className = ''), 3200);
    }

    // Which build a machine is actually running, and whether that's the published one.
    // Compared against agent.json rather than against whatever build is newest among the
    // machines — otherwise a fleet where EVERY machine is stale would look perfectly healthy.
    function agentBuildCell(m) {
      const running = (m.agentSha256 || '').toLowerCase();
      const expected = (state.expectedAgentSha256 || '').toLowerCase();
      const version = m.agentVersion || '—';

      if (!running) return el('span', { textContent: version, title: 'This machine has not reported a build hash yet (older agent).' });
      const short = running.slice(0, 8);
      if (!expected) {
        return el('span', { textContent: `${version} · ${short}`, title: 'No agent.json published, so there is nothing to compare against.' });
      }
      if (running === expected) {
        return el('span', { textContent: `${version} · ${short}`, className: 'build-ok',
          title: 'Running the published build.' });
      }
      return el('span', { textContent: `${version} · ${short} (update pending)`, className: 'build-pending',
        title: `Running ${short}, but agent.json publishes ${expected.slice(0, 8)}. It should update on its next sync; if it stays like this, check that machine's log for "self-update:".` });
    }

    function relTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso); if (isNaN(d)) return iso;
      const secs = Math.round((Date.now() - d.getTime()) / 1000);
      if (secs < 30) return 'just now';   // includes small negatives from VM/host clock skew
      if (secs < 60) return secs + 's ago';
      if (secs < 3600) return Math.round(secs / 60) + 'm ago';
      if (secs < 86400) return Math.round(secs / 3600) + 'h ago';
      return Math.round(secs / 86400) + 'd ago';
    }

    // Does a program currently apply to a machine? (matches the service's rule)
    function applies(prog, m) {
      if (prog.allMachines) return true;
      return prog.target.some(t =>
        t.toLowerCase() === 'all' ||
        t.toLowerCase() === m.machineId.toLowerCase() ||
        t.toLowerCase() === m.hostname.toLowerCase());
    }

    async function load() {
      $('#save').disabled = true; dirty = false;
      let data;
      try {
        const r = await fetch('/api/state');
        if (!r.ok) { toast('Load failed: ' + (await r.text()), true); return; }
        data = await r.json();
      } catch (e) { toast('Load failed: ' + e.message, true); return; }
      state = data;
      state.programs = data.programs || [];

      // Working selection per program: an "all" flag + a Set of machineIds.
      // Deleted programs start unmarked; ticking a box re-activates them on save.
      state.sel = {};
      state.settings = {};
      for (const p of state.programs) {
        state.settings[p.id] = {
          version: p.version || '', type: p.type || 'exe',
          installPath: p.installPath || '', arguments: p.arguments || '', description: p.description || '',
          runAtStartup: !!p.runAtStartup, runAsAdmin: !!p.runAsAdmin, runOnceInstalled: !!p.runOnceInstalled
        };
        const isActive = (p.status || 'active').toLowerCase() === 'active';
        if (!isActive) { state.sel[p.id] = { all: false, ids: new Set() }; continue; }
        const checked = new Set(state.machines.filter(m => applies(p, m)).map(m => m.machineId));
        state.sel[p.id] = { all: p.allMachines, ids: checked };
      }
      state.labelEdits = {};

      render();
    }

    function render() {
      // warnings
      const w = $('#warnings'); w.innerHTML = '';
      for (const msg of state.warnings || []) w.append(el('div', { className: 'warn', textContent: msg }));

      renderMachines();
      renderTargeting();
    }

    function renderMachines() {
      const tb = $('#machines tbody'); tb.innerHTML = '';
      $('#noMachines').hidden = state.machines.length > 0;
      for (const m of state.machines) {
        const status = el('td', {}, [
          el('span', { className: 'dot ' + (m.online ? 'on' : 'off') }),
          m.online ? 'online' : 'offline'
        ]);
        const labelInput = el('input', {
          className: 'label', value: m.label || '', placeholder: m.hostname,
          oninput: e => { state.labelEdits[m.machineId] = e.target.value; markDirty(); }
        });
        const sync = m.lastSyncSuccess
          ? el('span', { className: 'pill ok', textContent: 'ok' })
          : el('span', { className: 'pill bad', title: m.lastError || '', textContent: 'error' });
        const power = el('td', {}, [
          el('button', { type: 'button', textContent: 'Shut down', title: 'Power off this machine on its next sync',
            onclick: () => sendCommand(m, 'shutdown') }),
          el('button', { type: 'button', textContent: 'Restart', style: 'margin-left:6px', title: 'Reboot this machine on its next sync',
            onclick: () => sendCommand(m, 'restart') }),
          el('button', { type: 'button', textContent: 'Screenshot', style: 'margin-left:6px',
            title: 'Capture the screen on its next sync (needs a logged-on user)', onclick: () => requestScreenshot(m) }),
          el('button', { type: 'button', textContent: 'Remote', style: 'margin-left:6px',
            title: 'Start a live remote-control session (needs a logged-on user)', onclick: () => startRemoteSession(m) })
        ]);
        // A changed remote-control key is refused until the operator vouches for it: after a
        // reinstall that's expected, but it's also exactly what an impersonating machine looks like.
        if (m.relayKey === 'changed') {
          power.append(el('button', { type: 'button', textContent: 'Trust new key', className: 'danger', style: 'margin-left:6px',
            title: 'This machine reports a different remote-control key than before. Only trust it if you reinstalled this machine.',
            onclick: () => trustRelayKey(m) }));
        }
        if (m.mac) {
          power.append(el('button', { type: 'button', textContent: 'Wake', style: 'margin-left:6px',
            title: 'Wake-on-LAN: ' + m.mac + ' (sent by the waker machine)', onclick: () => sendWake([m.machineId]) }));
        }
        if (m.lastScreenshotUtc) {
          power.append(el('a', {
            href: '/api/screenshot/' + encodeURIComponent(m.machineId), target: '_blank', rel: 'noopener',
            textContent: 'View', style: 'margin-left:6px', title: 'Captured ' + relTime(m.lastScreenshotUtc)
          }));
        }
        tb.append(el('tr', {}, [
          status,
          el('td', {}, labelInput),
          el('td', {}, el('code', { textContent: m.hostname })),
          el('td', { className: 'muted', textContent: m.os || '—' }),
          el('td', { className: 'muted' }, [agentBuildCell(m)]),
          el('td', { title: m.lastSeenUtc || '', textContent: relTime(m.lastSeenUtc) }),
          el('td', { textContent: (m.appliedProgramIds || []).length + ' program(s)' }),
          el('td', {}, sync),
          power
        ]));
      }
    }

    // ---- targeting: two pivot views, sharing the same state.sel model ----------------

    // Whether a program currently runs on a machine.
    function runsOn(sel, m) { return sel.all || sel.ids.has(m.machineId); }

    // Toggle one program on/off for one machine (handles converting "all" -> explicit set).
    function setRunsOn(p, m, on) {
      const sel = state.sel[p.id];
      if (on) {
        if (!sel.all) sel.ids.add(m.machineId);
      } else if (sel.all) {
        sel.all = false;                                             // "all" minus this machine
        sel.ids = new Set(state.machines.map(x => x.machineId));
        sel.ids.delete(m.machineId);
      } else {
        sel.ids.delete(m.machineId);
      }
      markDirty();
    }

    // Human summary of where a program runs.
    function targetSummary(sel) {
      if (sel.all) return 'All machines';
      const n = sel.ids.size;
      if (n === 0) return 'No machines (inactive)';
      const names = [...sel.ids].map(id => {
        const m = state.machines.find(x => x.machineId === id); return m ? (m.label || m.hostname) : id;
      });
      return `${n} machine${n > 1 ? 's' : ''}: ` + names.slice(0, 3).join(', ') + (n > 3 ? ` +${n - 3}` : '');
    }

    function badge(active) {
      return el('span', { className: 'pill ' + (active ? 'ok' : ''), textContent: active ? 'active' : 'deleted' });
    }

    function renderTargeting() {
      const host = $('#tview'); host.innerHTML = '';
      document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      const q = (filter || '').toLowerCase();

      if (state.programs.length === 0) { host.append(el('div', { className: 'empty', textContent: 'No programs in the manifest.' })); $('#tcount').textContent = ''; return; }
      (view === 'machine') ? renderByMachine(host, q) : renderByProgram(host, q);
    }

    // Each program is an expandable row; expand to tick machines. Scales down a long fleet.
    function renderByProgram(host, q) {
      const progs = state.programs.filter(p => !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q));
      $('#tcount').textContent = `${progs.length} program${progs.length !== 1 ? 's' : ''}`;
      if (progs.length === 0) { host.append(el('div', { className: 'empty', textContent: 'No programs match.' })); return; }

      for (const p of progs) {
        const sel = state.sel[p.id];
        const item = el('details', { className: 'titem' });
        if (expanded.has('p:' + p.id)) item.open = true;
        item.addEventListener('toggle', () => item.open ? expanded.add('p:' + p.id) : expanded.delete('p:' + p.id));

        const badgeEl = badge(sel.all || sel.ids.size > 0);
        const sumEl = el('span', { className: 'tsum muted', textContent: targetSummary(sel) });
        const update = () => { const a = sel.all || sel.ids.size > 0; badgeEl.className = 'pill ' + (a ? 'ok' : ''); badgeEl.textContent = a ? 'active' : 'deleted'; sumEl.textContent = targetSummary(sel); };

        item.append(el('summary', {}, [
          badgeEl,
          el('span', { className: 'tname', textContent: p.name }),
          el('span', { className: 'muted tid', textContent: p.id + (p.version ? ' · v' + p.version : '') }),
          sumEl
        ]));

        const body = el('div', { className: 'tbody' });
        const boxes = [];
        const allCb = el('input', { type: 'checkbox', checked: sel.all,
          onchange: e => { sel.all = e.target.checked; boxes.forEach(({ cb, id }) => { cb.disabled = sel.all; cb.checked = sel.all || sel.ids.has(id); }); markDirty(); update(); } });
        body.append(el('label', { className: 'allrow' }, [ allCb, document.createTextNode(' All machines (including ones that join later)') ]));

        const grid = el('div', { className: 'checklist' });
        for (const m of state.machines) {
          const cb = el('input', { type: 'checkbox', checked: sel.all || sel.ids.has(m.machineId), disabled: sel.all,
            onchange: e => { e.target.checked ? sel.ids.add(m.machineId) : sel.ids.delete(m.machineId); markDirty(); update(); } });
          boxes.push({ cb, id: m.machineId });
          grid.append(el('label', {}, [ cb, el('span', { className: 'dot ' + (m.online ? 'on' : 'off') }), document.createTextNode(m.label || m.hostname) ]));
        }
        body.append(grid);
        body.append(settingsEditor(p));
        item.append(body);
        host.append(item);
      }
    }

    // Per-program settings editor (runAtStartup/runAsAdmin/runOnce + fields). Edits go to state.settings.
    function settingsEditor(p) {
      const st = state.settings[p.id];
      const set = (k, v) => { st[k] = v; markDirty(); };
      const cfg = el('div', { className: 'cfg' });
      cfg.append(el('div', { className: 'cfglabel', textContent: 'Settings' }));

      const flags = el('div', { className: 'flags' });
      const flag = (k, label) => el('label', {}, [
        el('input', { type: 'checkbox', checked: st[k], onchange: e => set(k, e.target.checked) }),
        document.createTextNode(' ' + label)
      ]);
      flags.append(flag('runAtStartup', 'runAtStartup'), flag('runAsAdmin', 'runAsAdmin'), flag('runOnceInstalled', 'runOnceInstalled'));
      // "Run now" — fires once on each targeted machine's next sync, in the user's session.
      const runBtn = el('button', { type: 'button', textContent: 'Run now',
        title: 'Run this program once on each targeted machine, in the logged-in user session',
        onclick: () => runNow(p) });
      const delBtn = el('button', { type: 'button', className: 'danger', textContent: 'Delete program',
        title: 'Remove from the manifest entirely and uninstall from every machine',
        onclick: () => deleteProgram(p) });
      flags.append(runBtn, delBtn);
      cfg.append(flags);

      const g = el('div', { className: 'cfggrid' });
      const typeSel = el('select', { className: 'fld', onchange: e => set('type', e.target.value) });
      for (const tp of ['exe', 'batch', 'powershell', 'vbs', 'python']) {
        const o = el('option', { value: tp, textContent: tp }); if (st.type === tp) o.selected = true; typeSel.append(o);
      }
      const fld = (k, ph) => el('input', { className: 'fld', value: st[k] || '', placeholder: ph || '', oninput: e => set(k, e.target.value) });
      g.append(el('label', { className: 'muted', textContent: 'Type' }), typeSel);
      g.append(el('label', { className: 'muted', textContent: 'Version' }), fld('version'));
      g.append(el('label', { className: 'muted', textContent: 'Install path' }), fld('installPath'));
      g.append(el('label', { className: 'muted', textContent: 'Arguments' }), fld('arguments', '(optional)'));
      g.append(el('label', { className: 'muted', textContent: 'Description' }), fld('description', '(optional)'));
      cfg.append(g);
      return cfg;
    }

    // Each machine is an expandable row; expand to tick which programs run on it.
    function renderByMachine(host, q) {
      if (state.machines.length === 0) { host.append(el('div', { className: 'empty', textContent: 'No machines have reported yet.' })); $('#tcount').textContent = ''; return; }
      const machines = state.machines.filter(m => !q || (m.label || '').toLowerCase().includes(q) || m.hostname.toLowerCase().includes(q));
      $('#tcount').textContent = `${machines.length} machine${machines.length !== 1 ? 's' : ''}`;
      if (machines.length === 0) { host.append(el('div', { className: 'empty', textContent: 'No machines match.' })); return; }

      for (const m of machines) {
        const item = el('details', { className: 'titem' });
        if (expanded.has('m:' + m.machineId)) item.open = true;
        item.addEventListener('toggle', () => item.open ? expanded.add('m:' + m.machineId) : expanded.delete('m:' + m.machineId));

        const countOf = () => state.programs.filter(p => runsOn(state.sel[p.id], m)).length;
        const sumEl = el('span', { className: 'tsum muted', textContent: `${countOf()} program(s)` });
        const update = () => { sumEl.textContent = `${countOf()} program(s)`; };

        item.append(el('summary', {}, [
          el('span', { className: 'dot ' + (m.online ? 'on' : 'off') }),
          el('span', { className: 'tname', textContent: m.label || m.hostname }),
          el('span', { className: 'muted tid', textContent: m.hostname }),
          sumEl
        ]));

        const body = el('div', { className: 'tbody' });
        const grid = el('div', { className: 'checklist' });
        for (const p of state.programs) {
          const cb = el('input', { type: 'checkbox', checked: runsOn(state.sel[p.id], m),
            onchange: e => { setRunsOn(p, m, e.target.checked); update(); } });
          const allTag = state.sel[p.id].all ? el('span', { className: 'muted', textContent: ' (all)' }) : document.createTextNode('');
          grid.append(el('label', {}, [ cb, document.createTextNode(p.name), allTag ]));
        }
        body.append(grid);
        item.append(body);
        host.append(item);
      }
    }

    async function save() {
      const body = {
        programTargets: state.programs.map(p => ({
          id: p.id, all: state.sel[p.id].all, machineIds: [...state.sel[p.id].ids],
          settings: state.settings[p.id]
        })),
        labels: {}
      };
      // start from existing labels, apply edits
      for (const m of state.machines) if (m.label) body.labels[m.machineId] = m.label;
      for (const [id, v] of Object.entries(state.labelEdits)) {
        if (v && v.trim()) body.labels[id] = v.trim(); else delete body.labels[id];
      }

      $('#save').disabled = true;
      try {
        const r = await fetch('/api/save', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) {
          toast(res.commit ? `Saved · commit ${res.commit}` : (res.message || 'Saved'));
          await load();
        } else {
          toast('Save failed: ' + (res.message || res.detail || 'unknown error'), true);
          $('#save').disabled = false;
        }
      } catch (e) { toast('Save failed: ' + e.message, true); $('#save').disabled = false; }
    }

    // --- Add-program form ---
    document.querySelectorAll('input[name="a-src"]').forEach(radio => radio.onchange = () => {
      const imp = document.querySelector('input[name="a-src"]:checked').value === 'import';
      $('#a-local').hidden = !imp; $('#a-local-label').hidden = !imp;
      $('#a-repopath').hidden = imp; $('#a-repopath-label').hidden = imp;
    });

    async function addProgram() {
      const mode = document.querySelector('input[name="a-src"]:checked').value;
      const body = {
        name: $('#a-name').value.trim(),
        version: $('#a-version').value.trim() || '1.0',
        type: $('#a-type').value,
        description: $('#a-desc').value.trim(),
        sourceMode: mode,
        localFilePath: $('#a-local').value.trim(),
        repoPath: $('#a-repopath').value.trim(),
        fileName: $('#a-filename').value.trim(),
        installPath: $('#a-install').value.trim(),
        arguments: $('#a-args').value.trim(),
        runAtStartup: $('#a-startup').checked,
        runAsAdmin: $('#a-admin').checked,
        runOnceInstalled: $('#a-once').checked,
        all: $('#a-all').checked,
        machineIds: []
      };
      if (!body.name) { toast('Name is required', true); return; }
      if (mode === 'import' && !body.localFilePath) { toast('Local file path is required', true); return; }
      if (mode === 'path' && !body.repoPath) { toast('Repo path is required', true); return; }

      const btn = $('#a-submit'); btn.disabled = true;
      try {
        const r = await fetch('/api/add', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) {
          toast(res.commit ? `Added · commit ${res.commit}` : (res.message || 'Added'));
          ['a-name', 'a-local', 'a-repopath', 'a-filename', 'a-install', 'a-args', 'a-desc'].forEach(id => $('#' + id).value = '');
          await load();
        } else {
          toast('Add failed: ' + (res.message || res.detail || 'unknown error'), true);
        }
      } catch (e) { toast('Add failed: ' + e.message, true); }
      finally { btn.disabled = false; }   // always re-enable, including after a successful add
    }
    // Delete a program entirely (removes it from the manifest + repo; uninstalls fleet-wide).
    async function deleteProgram(p) {
      if (!confirm(`Delete "${p.name}" (${p.id}) entirely?\n\nIt's removed from the manifest and uninstalled from every machine on its next sync. This can't be undone from here.`)) return;
      try {
        const r = await fetch('/api/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) { toast(res.commit ? `Deleted · ${res.commit}` : (res.message || 'Deleted')); await load(); }
        else { toast('Delete failed: ' + (res.message || res.detail || 'unknown error'), true); }
      } catch (e) { toast('Delete failed: ' + e.message, true); }
    }

    // Request a screenshot capture from a machine (captured on its next sync).
    async function requestScreenshot(m) {
      try {
        const r = await fetch('/api/screenshot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ machineId: m.machineId })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) toast(res.commit ? `Screenshot requested · ${res.commit}` : (res.message || 'Screenshot requested'));
        else toast('Screenshot failed: ' + (res.message || res.detail || 'unknown error'), true);
      } catch (e) { toast('Screenshot failed: ' + e.message, true); }
    }

    // Start a live remote-control session: queues the request, then opens the viewer tab
    // (it shows "waiting for the agent" until that machine's next sync picks the request up).
    async function startRemoteSession(m) {
      try {
        const r = await fetch('/api/remote-session', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ machineId: m.machineId })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok && res.sessionId) {
          toast(res.alreadyRunning
            ? (res.message || 'Session already open — reopening its viewer')
            : (res.commit ? `Remote session requested · ${res.commit}` : (res.message || 'Remote session requested')));
          const label = encodeURIComponent(m.label || m.hostname);
          window.open(`/remote.html?sessionId=${encodeURIComponent(res.sessionId)}&machineId=${encodeURIComponent(m.machineId)}&label=${label}`, '_blank');
        } else {
          toast('Remote session failed: ' + (res.message || res.detail || 'unknown error'), true);
        }
      } catch (e) { toast('Remote session failed: ' + e.message, true); }
    }

    async function trustRelayKey(m) {
      const name = m.label || m.hostname;
      if (!confirm(`${name} reports a NEW remote-control key.\n\nThat's normal if you reinstalled it. If you didn't, another machine may be ` +
                   `trying to pose as it — don't trust the key; check that machine first.\n\nTrust the new key?`)) return;
      try {
        const r = await fetch('/api/trust-relay-key', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ machineId: m.machineId })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) { toast(res.message || 'Key trusted'); load(); }
        else toast('Trust failed: ' + (res.message || res.detail || 'unknown error'), true);
      } catch (e) { toast('Trust failed: ' + e.message, true); }
    }

    // Wake-on-LAN one or more machines (by id; the waker sends the packets).
    async function sendWake(machineIds) {
      if (!machineIds || machineIds.length === 0) { toast('No machines with a known MAC to wake', true); return; }
      try {
        const r = await fetch('/api/wake', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ machineIds })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) toast(res.commit ? `Wake queued · ${res.commit}` : (res.message || 'Wake queued'));
        else toast('Wake failed: ' + (res.message || res.detail || 'unknown error'), true);
      } catch (e) { toast('Wake failed: ' + e.message, true); }
    }

    // Send a power command (shutdown/restart) to a machine.
    async function sendCommand(m, action) {
      const verb = action === 'shutdown' ? 'Shut down' : 'Restart';
      if (!confirm(`${verb} "${m.label || m.hostname}"?\n\nHappens on the machine's next sync (~1 cycle), after a 15-second warning on the machine.`)) return;
      try {
        const r = await fetch('/api/command', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ machineId: m.machineId, action })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) toast(res.commit ? `${verb} sent · ${res.commit}` : (res.message || 'sent'));
        else toast(`${verb} failed: ` + (res.message || res.detail || 'unknown error'), true);
      } catch (e) { toast(`${verb} failed: ` + e.message, true); }
    }

    // Fire a one-time "run now" for a program (pushes a fresh runRequest token).
    async function runNow(p) {
      if (!confirm(`Run "${p.name}" now on all machines it's targeted at?`)) return;
      try {
        const r = await fetch('/api/runnow', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id })
        });
        const res = await r.json().catch(() => ({ message: r.statusText }));
        if (r.ok && res.ok) toast(res.commit ? `Run-now sent · ${res.commit}` : (res.message || 'Run-now sent'));
        else toast('Run-now failed: ' + (res.message || res.detail || 'unknown error'), true);
      } catch (e) { toast('Run-now failed: ' + e.message, true); }
    }

    $('#a-submit').onclick = addProgram;

    // View switch + filter
    document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { view = b.dataset.view; renderTargeting(); });
    $('#search').oninput = e => { filter = e.target.value; renderTargeting(); };

    $('#reload').onclick = () => {
      if (dirty && !confirm('Discard unsaved changes and reload?')) return;
      load();
    };
    $('#save').onclick = save;
    $('#wakeAll').onclick = () => {
      const ids = (state?.machines || []).filter(m => m.mac).map(m => m.machineId);
      if (ids.length === 0) { toast('No machines with a known MAC', true); return; }
      if (!confirm(`Wake all ${ids.length} machine(s) with a known MAC?`)) return;
      sendWake(ids);
    };

    fetch('/api/info').then(r => r.json()).then(i => { $('#repo').textContent = i.repoPath; }).catch(() => {});
    load();
  </script>
  <script>
    // ---- 0/1 rain behind the page (decoration only) ------------------------------------
    // Columns of binary digits fall down a fixed canvas, each leaving a fading trail. Kept
    // separate from the app script above so it can't interfere with it, and kept cheap: it
    // redraws ~20 times a second, skips frames while the tab is hidden, and draws a single
    // still frame instead of animating when the OS asks for reduced motion.
    (() => {
      const canvas = document.getElementById('rain');
      const ctx = canvas.getContext('2d');
      const SIZE = 16;                  // px per glyph cell
      const STEP_MS = 50;               // ~20 fps is plenty for a background
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let drops = [];                   // per column: current row of the falling head

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.font = `${SIZE - 2}px ui-monospace, Consolas, monospace`;
        const cols = Math.ceil(innerWidth / SIZE);
        // Start every column at a random height so the rain doesn't begin as one flat line.
        drops = Array.from({ length: cols }, (_, i) => drops[i] ?? Math.floor(Math.random() * -innerHeight / SIZE));
        ctx.fillStyle = '#020803';
        ctx.fillRect(0, 0, innerWidth, innerHeight);
      }

      function step() {
        // Paint over the last frame with a translucent black, which is what makes the trails fade.
        ctx.fillStyle = 'rgba(2, 8, 3, 0.12)';
        ctx.fillRect(0, 0, innerWidth, innerHeight);
        for (let i = 0; i < drops.length; i++) {
          const y = drops[i] * SIZE;
          if (y >= 0) {
            // The head of each column is near-white, the rest phosphor green.
            ctx.fillStyle = Math.random() < 0.08 ? '#d6ffe2' : '#00ff66';
            ctx.fillText(Math.random() < 0.5 ? '0' : '1', i * SIZE, y);
          }
          // Once a column is off the bottom, restart it at the top after a random pause.
          drops[i] = y > innerHeight && Math.random() > 0.975 ? 0 : drops[i] + 1;
        }
      }

      resize();
      addEventListener('resize', resize);
      if (still) {
        // A static scatter of digits keeps the look without any movement.
        for (let n = 0; n < 60; n++) step();
        return;
      }
      let last = 0;
      const loop = (t) => {
        if (!document.hidden && t - last >= STEP_MS) { last = t; step(); }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
