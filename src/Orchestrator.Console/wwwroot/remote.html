<!DOCTYPE html>
<!--
  FILE PURPOSE (in plain terms): The live remote-control viewer. Opened in its own tab from
  the console's "Remote" button. Connects to /relay/view?sessionId=... over a WebSocket, draws
  each incoming JPEG frame to a canvas, and sends your mouse and keyboard back over the same
  socket as small JSON messages.

  While input is on, this page deliberately swallows your browser's own shortcuts so they
  reach the remote machine instead of this tab — which is exactly why the "Input: on/off"
  button exists and has to stay easy to find.

  It also reports exactly which stage the session is at, because a black canvas on its own
  says nothing: waiting for the target machine to notice the request, connected but no frames
  yet, or given up. The relay sends those stages as JSON text messages; frames arrive as
  binary, so the two never get confused.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchestrator — Remote control</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; color: #e5e7eb; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: #1f2937; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .status { color: #9ca3af; font-size: 12px; }
    header .spacer { flex: 1; }
    button { font: inherit; border: 1px solid #374151; background: #111827; color: #e5e7eb;
             padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { border-color: #4b5563; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; background: #000; }
    canvas { max-width: 100%; max-height: 100%; }
    .msg { color: #9ca3af; font-size: 13px; padding: 0 20px; text-align: center; max-width: 640px; }
    .msg h2 { font-size: 14px; color: #e5e7eb; margin: 0 0 8px; font-weight: 600; }
    .msg ul { text-align: left; margin: 12px 0 0; padding-left: 20px; line-height: 1.7; }
    .msg code { background: #1f2937; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Remote control</h1>
    <span class="status" id="status">Connecting…</span>
    <span class="spacer"></span>
    <button id="inputToggle" title="When on, your mouse and keyboard drive the remote machine and normal browser shortcuts are suppressed">Input: on</button>
    <button id="end">End session</button>
  </header>
  <main>
    <div class="msg" id="waiting">Connecting to the relay…</div>
    <canvas id="canvas" hidden></canvas>
  </main>
  <script>
    // Everything below builds HTML by hand, and both the label (from the URL) and close
    // reasons (from the relay) end up inside it — so they go through esc() first.
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    const params = new URLSearchParams(location.search);
    const sessionId = params.get('sessionId');
    const label = esc(params.get('label') || params.get('machineId') || '');
    document.getElementById('title').textContent = 'Remote control — ' + (params.get('label') || params.get('machineId') || '');

    const statusEl = document.getElementById('status');
    const waitingEl = document.getElementById('waiting');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let opened = false;      // did the WebSocket handshake ever succeed?
    let agentJoined = false; // did the target machine's agent connect?
    let countdown = null;    // interval id for the "waiting" timer
    let endReason = null;    // reason the relay told us, before the socket dropped

    // The list below is the whole point of this page's error handling: every one of these is
    // a real way a session silently produces no picture, and none of them are visible from here.
    const checklist = `
      <ul>
        <li><code>Orchestrator:RelayUrl</code> must be set in that machine's <code>appsettings.json</code>
            (install with <code>-RelayUrl</code>) — if it's blank, the session exits immediately.</li>
        <li>Someone must be signed in on that machine — the capture runs in their desktop session.</li>
        <li>This console must be reachable from it: bound beyond localhost, and through the firewall.</li>
        <li>With a self-signed certificate, that machine needs <code>Orchestrator:RelayCertThumbprint</code> set.</li>
      </ul>
      <p>The banner on that machine shows the reason; its log is in the install folder under <code>logs\\</code>.</p>`;

    function showMessage(html, statusText) {
      statusEl.textContent = statusText;
      waitingEl.innerHTML = html;
      waitingEl.hidden = false;
      canvas.hidden = true;
      if (countdown) { clearInterval(countdown); countdown = null; }
    }

    // Count down the window the relay will hold the session open waiting for the agent, so the
    // wait has a visible end instead of looking indistinguishable from a hang.
    function showWaiting(untilUtc) {
      const until = Date.parse(untilUtc);
      const render = () => {
        const left = Math.max(0, Math.round((until - Date.now()) / 1000));
        const mins = String(Math.floor(left / 60)).padStart(2, '0');
        const secs = String(left % 60).padStart(2, '0');
        waitingEl.innerHTML =
          `<h2>Waiting for ${label || 'the machine'} to pick up the request…</h2>` +
          `<p>It starts on that machine's next sync, so this can take a few minutes. Giving up in ${mins}:${secs}.</p>`;
        statusEl.textContent = 'Waiting for the machine';
      };
      render();
      countdown = setInterval(render, 1000);
    }

    if (!sessionId) {
      showMessage('<h2>Missing sessionId in the URL.</h2><p>Open this page with the console’s Remote button.</p>', 'No session');
    } else {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/relay/view?sessionId=${encodeURIComponent(sessionId)}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => { opened = true; statusEl.textContent = 'Connected to relay'; };

      ws.onclose = (ev) => {
        if (!opened) {
          // Rejected at the handshake: the relay only knows sessions it issued and still holds
          // in memory, so a console restart between queueing and opening this page lands here.
          showMessage(
            '<h2>This console doesn’t recognise the session.</h2>' +
            '<p>Pending sessions are held in memory, so restarting the console cancels them. ' +
            'Close this tab and press <b>Remote</b> again.</p>', 'Unknown session');
          return;
        }
        // An abrupt drop (code 1006) carries no reason, so prefer what the relay told us
        // over the socket's own — that's the difference between "the machine ended the
        // session" and a blank "the connection closed".
        const reason = esc(ev.reason || endReason || 'the connection closed');
        if (!agentJoined) {
          showMessage(`<h2>Gave up: ${reason}.</h2><p>Things to check on that machine:</p>${checklist}`, 'Ended');
        } else {
          showMessage(`<h2>Session ended.</h2><p>${reason}.</p>`, 'Ended');
        }
      };

      ws.onerror = () => { if (opened) statusEl.textContent = 'Connection error'; };

      ws.onmessage = async (ev) => {
        // Text = a status line from the relay; binary = an actual screen frame.
        if (typeof ev.data === 'string') {
          let msg; try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.t !== 'status') return;
          if (msg.state === 'waiting') showWaiting(msg.untilUtc);
          if (msg.state === 'ended') endReason = msg.reason || 'the session ended';
          if (msg.state === 'connected') {
            agentJoined = true;
            showMessage(
              `<h2>${label || 'The machine'} connected.</h2><p>Waiting for the first frame…</p>`,
              'Waiting for a frame');
          }
          return;
        }
        if (!(ev.data instanceof ArrayBuffer)) return;
        const blob = new Blob([ev.data], { type: 'image/jpeg' });
        const bitmap = await createImageBitmap(blob);
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
        if (canvas.hidden) {
          if (countdown) { clearInterval(countdown); countdown = null; }
          canvas.hidden = false;
          waitingEl.hidden = true;
          statusEl.textContent = 'Live';
        }
      };

      // ---- input capture (mouse + keyboard -> the remote machine) --------------------
      // Positions go out as FRACTIONS of the canvas, never pixels: the canvas holds a
      // downscaled capture of the whole virtual desktop whose size can change mid-session,
      // and the agent maps fractions straight onto Windows' absolute coordinate space.
      let inputEnabled = true;
      let lastMoveSent = 0;
      const toggle = document.getElementById('inputToggle');

      const send = (obj) => { if (inputEnabled && ws.readyState === 1) ws.send(JSON.stringify(obj)); };

      const pos = (ev) => {
        const r = canvas.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) return null;
        return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
      };

      const BUTTONS = { 0: 'left', 1: 'middle', 2: 'right' };

      canvas.addEventListener('mousemove', (ev) => {
        // ~60/s is plenty for a 5 fps view and keeps one flick of the wrist from queueing
        // hundreds of messages behind a slow link.
        const now = performance.now();
        if (now - lastMoveSent < 16) return;
        lastMoveSent = now;
        const p = pos(ev); if (p) send({ t: 'mousemove', x: p.x, y: p.y });
      });

      canvas.addEventListener('mousedown', (ev) => {
        const p = pos(ev); const b = BUTTONS[ev.button];
        if (p && b) { ev.preventDefault(); send({ t: 'mousedown', x: p.x, y: p.y, button: b }); }
      });

      canvas.addEventListener('mouseup', (ev) => {
        const p = pos(ev); const b = BUTTONS[ev.button];
        if (p && b) { ev.preventDefault(); send({ t: 'mouseup', x: p.x, y: p.y, button: b }); }
      });

      // Without this the browser's own menu opens on right-click and the remote never sees it.
      canvas.addEventListener('contextmenu', (ev) => { if (inputEnabled) ev.preventDefault(); });

      canvas.addEventListener('wheel', (ev) => {
        const p = pos(ev); if (!p) return;
        if (inputEnabled) ev.preventDefault();
        // Browsers report wheel deltas in wildly different units; the sign and one notch per
        // event is all that survives translation, so normalize to that. Negative deltaY is a
        // scroll up, which is a POSITIVE wheel notch on Windows.
        send({ t: 'wheel', x: p.x, y: p.y, dy: ev.deltaY < 0 ? 1 : -1 });
      }, { passive: false });

      // Keyboard is captured on the window, not the canvas, so it works without clicking first.
      const onKey = (ev) => {
        if (!inputEnabled) return;
        // Some events carry no physical key at all (IME composition, synthetic dispatches).
        // There's nothing to press on the far end, so don't put them on the wire.
        if (!ev.code) return;
        // Suppress the local browser's shortcuts (Ctrl+W, F5, Ctrl+T...) so they reach the
        // remote machine instead of acting on this tab. That's also exactly why the Input
        // toggle exists — it's the way back out.
        ev.preventDefault();
        send({ t: ev.type === 'keydown' ? 'keydown' : 'keyup', code: ev.code });
      };
      window.addEventListener('keydown', onKey);
      window.addEventListener('keyup', onKey);

      toggle.onclick = () => {
        inputEnabled = !inputEnabled;
        toggle.textContent = 'Input: ' + (inputEnabled ? 'on' : 'off');
        canvas.style.cursor = inputEnabled ? 'crosshair' : 'default';
      };
      canvas.style.cursor = 'crosshair';

      document.getElementById('end').onclick = () => {
        // Tell the agent first so it tears down deliberately (releasing anything still held)
        // rather than discovering a dropped socket.
        if (ws.readyState === 1) ws.send(JSON.stringify({ t: 'end' }));
        ws.close();
      };
    }
  </script>
</body>
</html>
