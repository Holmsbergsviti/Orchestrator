# =====================================================================================
# FILE PURPOSE (in plain terms):
#   Runs the Pester tests for the PowerShell installer on a real Windows runner.
#
#   These scripts are the least-tested and most dangerous part of the project: install.ps1
#   decides what ends up in appsettings.json, and self-update runs it (via update-agent.ps1)
#   to swap the service binary on every machine. A mistake in the settings merge silently
#   resets configuration fleet-wide — that has already happened once, with RelayUrl — and a
#   mistake in update-agent.ps1 breaks the very mechanism that recovers from a bad build.
#
#   Separate from publish-agent.yml on purpose: this needs a Windows runner, and a failure
#   here should be loud without blocking a binary publish that may be unrelated.
# =====================================================================================

name: Test scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/*.Tests.ps1'
      - 'defaults.json'
      - '.github/workflows/test-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/*.Tests.ps1'
  workflow_dispatch:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.5.0

      - name: Run the script tests
        shell: pwsh
        run: |
          # Import explicitly, in THIS step: each step is a fresh session, and Windows ships an
          # ancient Pester 3.x that would be auto-loaded instead — it has no
          # New-PesterConfiguration, so the run would fail for reasons unrelated to the tests.
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Write-Host "Pester $((Get-Module Pester).Version)"

          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $config

          # Put failures on the run's summary page. Downloading raw job logs needs repo-admin
          # rights, so without this a failure is invisible to anyone who can only see the run.
          $md = @("## Script tests", "", "Pester $((Get-Module Pester).Version) - " +
                  "$($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped", "")
          foreach ($t in $result.Tests | Where-Object Result -eq 'Failed') {
              $md += "### ``$($t.ExpandedPath)``"
              $md += '```'
              $md += ($t.ErrorRecord | ForEach-Object { $_.ToString() })
              $md += '```'
          }
          $md -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($result.FailedCount -gt 0) { exit 1 }
